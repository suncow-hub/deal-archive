# 딜 아카이브 태그 사전
# - 모든 딜 노트의 태그는 이 파일에 있는 값만 사용한다.
# - 대괄호 안은 별칭: 기사에 별칭이 나오면 앞의 대표 태그로 통일한다.
# - 사전에 없는 태그가 필요하면 tag-proposals.md에 제안만 남기고, 승인 후 여기에 추가한다.

# 지역: 인수자·대상·매도자 국가를 모두 태그 (여러 개 선택)
# 2개 이상이면 '크로스보더'는 자동으로 표시
지역:
  한국:     [Korea, KR, 국내]
  미국:     [US, USA, United States]
  유럽:     [Europe, EU, 영국, 독일, 프랑스]
  중국:     [China, 홍콩]
  일본:     [Japan]
  싱가포르: [Singapore, SG]
  동남아:   [베트남, 인도네시아, 태국, 말레이시아, 필리핀, ASEAN]
  중동:     [사우디, UAE, 카타르, Middle East]
  기타:     []

# 규모: 발표일 환율로 원화 환산 (하나만 선택)
규모:
  - 1천억 미만
  - 1천억~5천억
  - 5천억~1조
  - 1조~5조
  - 5조~20조
  - 20조 이상
  - 비공개

# 유형: 해당하는 것 모두 (예: PE가 경영권 인수 → 둘 다)
유형:
  - 경영권 인수
  - 합병
  - 완전자회사화      # 지배주주가 공개매수·주식교환 등으로 상장 자회사 잔여 지분을 정리
  - 소수지분 투자
  - PE 바이아웃
  - 엑시트·매각
  - 사업부 분할매각   # 카브아웃
  - 블록딜
  - IPO
  - 유상증자
  - 인수금융·채권

# 상태: 하나만, 업데이트되면 바뀜
상태: [검토·협상, 계약 체결, 거래 완료, 무산]

# 업종: 주 업종 1개 + 필요하면 1개 더
업종:
  - 반도체
  - 2차전지·소재
  - 자동차·모빌리티
  - 조선·방산·항공
  - 화학·정유·에너지
  - 신재생·인프라
  - 바이오·헬스케어
  - IT·소프트웨어·플랫폼
  - 통신·미디어·엔터
  - 유통·소비재·식음료
  - 금융 (은행·보험·증권·운용)
  - 부동산·건설
  - 산업재·기계
  - 철강·금속·소재
  - 보안·경비 서비스
  - 물류·운송
  - 기타

# 테마: 업종과 별개로, 해당할 때만 (여러 개 선택)
테마:
  AI·데이터센터: [AI, 인공지능, 데이터센터, data center, GPU]
