  category: 밸류에이션
  match: [EBITDA]
  aliases: [에비타, 상각전영업이익]
  short: 이자·세금·감가상각을 빼기 전의 이익. 회사가 본업으로 버는 현금을 대략 보여주는 숫자.
  more: 빚 구조나 세금, 설비 투자 방식이 다른 회사끼리도 본업의 돈 버는 힘을 비교할 수 있어서 M&A 가격 산정에 가장 많이 쓰인다.
  related: [EV/EBITDA (멀티플)]
  memo: ""

- id: ev-ebitda
