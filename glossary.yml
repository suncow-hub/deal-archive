  short: 인수 가격이 인수 소식 직전 주가보다 몇 % 높은지. 경영권을 가져오는 대가로 얹어주는 웃돈이다.
  example: DoorDash는 Instacart 주식을 보도 전 종가보다 26% 높은 주당 65달러에 사기로 했다.
