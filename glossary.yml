# 금융·딜 용어집
# - term: 화면에 보이는 대표 이름 / en: 영어 원어
# - match: 딜 노트·브리핑에서 자동으로 밑줄을 칠 표현 (길게 겹치면 긴 쪽이 우선)
# - aliases: 밑줄은 치지 않지만 드래그·검색했을 때 이 용어로 찾아지는 표현 (예: 다른 뜻과 헷갈리는 약어)
# - short: 한두 문장 쉬운 풀이 (밑줄에 마우스를 올리면 뜨는 내용)
# - more: 조금 더 자세한 설명 (용어집 탭에서 보임)
# - example / deal: 아카이브에서 실제로 쓰인 예와 그 딜 노트 id
# - related: 같이 보면 좋은 용어 (term 값)
# - memo: 내 메모 — 수업·WSP에서 배운 내용을 자유롭게 적는 칸 (GitHub에서 직접 고치면 됨)

# ---------------- 밸류에이션
- id: enterprise-value
  term: EV (기업가치)
  en: Enterprise Value
  category: 밸류에이션
  match: [기업가치, Enterprise Value]
  aliases: [EV]
  short: 회사를 통째로 살 때 실제로 감당하는 값. 지분가치(주식 전체의 값)에 순부채를 더해 구한다.
  more: 인수자는 주식만 사는 게 아니라 회사의 빚도 함께 떠안는다. 그래서 회사끼리 가격을 비교할 때는 빚이 많고 적음에 영향을 덜 받는 EV를 기준으로 쓴다.
  example: Thrive–ADT는 지분가치 76억 달러, EV 153억 달러였다. 두 값의 차이가 ADT가 가진 순부채 등에 해당한다.
  deal: 2026-10-29-thrive-holdings-adt
  related: [지분가치 (Equity Value), 순부채, EV/EBITDA (멀티플)]
  memo: ""

- id: equity-value
  term: 지분가치 (Equity Value)
  en: Equity Value
  category: 밸류에이션
  match: [지분가치, Equity Value]
  aliases: []
  short: 회사 주식 전체의 값. 상장사라면 시가총액, 인수에서는 주당 인수가격 × 전체 주식 수.
  more: 기사에서 "○○억 달러에 인수"라고 할 때 이 숫자가 지분가치인지 EV인지 꼭 구분해야 한다. 빚이 많은 회사는 둘의 차이가 크다.
  example: DoorDash–Instacart의 170억 달러는 지분가치 기준이다.
  deal: 2026-10-29-doordash-instacart
  related: [EV (기업가치), 시가총액]
  memo: ""

- id: market-cap
  term: 시가총액
  en: Market Capitalization
  category: 밸류에이션
  match: [시가총액, 시총]
  aliases: [Market Cap]
  short: 주가 × 발행주식 수. 시장이 지금 매기는 상장사 주식 전체의 값.
  more: 인수 가격은 보통 시가총액에 프리미엄을 얹어서 정해진다.
  related: [지분가치 (Equity Value), 인수 프리미엄]
  memo: ""

