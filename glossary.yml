  short: 모회사와 자회사가 둘 다 상장돼 있을 때 모회사 주가가 자회사 가치를 제대로 반영하지 못하고 낮게 매겨지는 현상.
  more: 같은 이익이 두 번 계산된다는 우려, 자회사 소액주주와의 이해충돌 등이 이유로 꼽힌다. 완전자회사화로 자회사를 상장폐지하는 것이 해소 방법 중 하나다.
  example: KISCO홀딩스는 한국철강 완전자회사화의 이유로 중복상장 디스카운트 해소를 내세웠다.
  deal: 2026-10-30-kisco-holdings-korea-steel
  related: [완전자회사(화), 지주사]
  memo: ""

