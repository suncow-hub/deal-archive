  category: 밸류에이션
  match: [EV/EBITDA, 멀티플]
  aliases: [배수, Multiple]
  short: 기업가치가 EBITDA의 몇 배인지. "몇 년 치 현금 창출력을 주고 샀나"로 이해하면 쉽다.
  more: 같은 업종의 다른 거래들과 배수를 비교해 비싸게 샀는지 싸게 샀는지 판단한다. 성장이 빠른 업종일수록 배수가 높다.
  example: Vistra는 Cogentrix를 EBITDA 약 7.25배에 인수했다 (딜 노트 기준).
  deal: 2026-01-05-vistra-cogentrix-energy
  related: [EBITDA, EV (기업가치)]
  memo: ""

- id: premium
  term: 인수 프리미엄
