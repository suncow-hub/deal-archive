# - 딜 노트의 이름은 여기 있는 대표 이름(왼쪽 키)만 쓴다.
# - type: 기업 / PE·VC / 재무 자문사 / 법률 자문사 / 정부·기관
# - country: tags.yml 지역 값
# - aliases: 다른 표기 (기사에 이렇게 나와도 대표 이름으로 통일)
# - krx: 한국 상장사 6자리 종목코드 (시세 자동 추적), ticker: 해외 상장사 TradingView 심볼 (예: NASDAQ:DASH)
