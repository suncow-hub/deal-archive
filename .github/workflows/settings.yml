name: settings

# 사이트 차트 탭의 '편집' → "[설정]" 이슈 → 이 워크플로가 market/settings.yml 에 반영하고 사이트를 다시 만든다.
# 리포가 공개라 누구나 이슈를 열 수 있으므로, 리포 주인이 연 이슈만 처리한다 (다른 사람 이슈는 아예 실행 안 됨).
# 이슈 본문은 환경 변수로만 넘기고 셸 명령에 끼워 넣지 않는다.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      startsWith(github.event.issue.title, '[설정]') &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml markdown
      - name: Apply settings
        id: apply
        env:
          BODY: ${{ github.event.issue.body }}
        run: python scripts/apply_settings.py "$RUNNER_TEMP/result.md"
      - name: Fetch market data (새 종목·지수 1년치)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/market.py > /dev/null
      - run: python scripts/validate.py
      - run: python scripts/build_site.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market docs
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "settings: #$ISSUE"
            for i in 1 2 3; do
              git pull --rebase -q origin main || { python scripts/build_site.py && git add docs && GIT_EDITOR=true git rebase --continue; }
              git push -q && break
              sleep 5
            done
          fi
      - name: Report
        if: always()
        run: |
          f="$RUNNER_TEMP/result.md"
          [ -s "$f" ] || echo "설정 처리 중 오류가 났어요. Actions 탭의 settings 실행 기록을 확인하세요." > "$f"
          printf '\n\n[실행 기록](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$f"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$f"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
