name: site-check

# 배포된 사이트를 실제 브라우저로 열어 화면을 캡처한다 (수동 실행).
# 결과 이미지는 main이 아니라 site-check 브랜치에만 올린다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Capture
        run: |
          mkdir -p out && cat > shot.py <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          B = "https://suncow-hub.github.io/deal-archive/"
          PAGES = [("home", "#/", 1200), ("chart-kr", "#/chart?s=005930", 1200), ("chart-kospi", "#/chart?s=KOSPI", 1200),
                   ("chart-global", "#/chart?s=NASDAQ:DASH", 1200), ("mobile-home", "#/", 390)]
          async def main():
              log = {}
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  for name, path, w in PAGES:
                      pg = await b.new_page(viewport={"width": w, "height": 900})
                      errs = []
                      pg.on("pageerror", lambda e, errs=errs: errs.append(str(e)))
                      await pg.goto(B + path, wait_until="networkidle")
                      await pg.wait_for_timeout(6000)
                      await pg.screenshot(path=f"out/{name}.png")
                      log[name] = {"errors": errs, "canvas": await pg.locator("canvas").count(),
                                   "iframes": await pg.locator("iframe").count()}
                  await b.close()
              open("out/log.json", "w").write(json.dumps(log, ensure_ascii=False, indent=1))
              print(json.dumps(log, ensure_ascii=False))
          asyncio.run(main())
          PY
          python shot.py
      - name: Push screenshots
        run: |
          cd out
          git init -q -b site-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "site check $(date -u +%FT%TZ)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-check
