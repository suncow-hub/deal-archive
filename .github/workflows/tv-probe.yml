name: tv-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p out && cat > p.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          SYMS = ["FRED:DGS10", "CBOE:TNX", "TVC:TNX", "BONDS:US10Y", "ECONOMICS:USINTR", "TVC:DXY", "FX_IDC:USDKRW", "TVC:KOSPI", "KRX:KOSPI"]
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  for i, s in enumerate(SYMS):
                      pg = await b.new_page(viewport={"width": 360, "height": 220})
                      cfg = '{"symbol":"%s","width":340,"colorTheme":"light","isTransparent":false,"locale":"en"}' % s
                      await pg.set_content('<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>'
                          '<script src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>' + cfg + '</script></div>')
                      await pg.wait_for_timeout(6000)
                      await pg.screenshot(path=f"out/{i}-{s.replace(':','_')}.png")
                  await b.close()
          asyncio.run(main())
          PY
          python p.py
      - run: |
          cd out && git init -q -b tv-probe && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m probe && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tv-probe
